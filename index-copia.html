<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>Crea un form HTML5</title>
</head>
<body>
    <div class="container mt-4">
        <div class="card">

            <div class="card-header">
                Payment form example
            </div>

            <div class="card-body">
                <div class="alert alert-danger" role="alert">
    Some fields are missing
</div>
                <form>

                    
                    <div class="row g-3">
                        <div class="col-4">
                            <label class="form-label">Card #</label>
                            <input type="text" class="form-control" placeholder="XXXXXXXXXXXXXXXX">
                        </div>
                        <div class="col-4">
                            <label class="form-label">CVC #</label>
                            <input type="text" class="form-control" placeholder="0000">
                        </div>
                        <div class="col-4">
                            <label class="form-label">Amount</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">$</span>
                                </div>
                                <input type="number" class="form-control" placeholder="Amount">
                            </div>
                        </div>
                    </div>

                    
                    <div class="row g-3 mt-2">
                        <div class="col-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>

                    
                    <div class="row g-3 mt-2">
                        <div class="col-6">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-3">
                            <label class="form-label">State</label>
                            <select class="form-control">
                                <option>Pick a state</option>
                            </select>
                        </div>
                        <div class="col-3">
                            <label class="form-label">Postal Code</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>

                    
                    <div class="row g-3 mt-2">
                        <div class="col-6">
                            <label class="form-label">We accept:</label>
                            <div>
                                <input type="radio" name="card"><img src="https://img.icons8.com/color/48/visa.png" width="40">
                                <input type="radio" name="card"><img src="https://img.icons8.com/color/48/mastercard.png" width="40">
                                <input type="radio" name="card"><img src="https://img.icons8.com/color/48/amex.png" width="40">
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="3" placeholder="Add any notes here."></textarea>
                        </div>
                    </div>

                </form>
            </div>

            <div class="card-footer d-flex justify-content-end">
                <button type="button" class="btn btn-secondary m-1">Cancel</button>
                <button type="submit" class="btn btn-primary m-1">Send</button>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
</body>
</html>mk
